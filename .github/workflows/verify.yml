name: Verify archive

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python scripts/verify_artifacts.py
      - run: python scripts/check_sensitive_strings.py --git-history
      - run: python scripts/build_notebook_index.py
      - run: python scripts/reproduce_mininet_table.py
      - run: python -m unittest discover -s tests -v
      - run: git diff --exit-code -- artifacts/NOTEBOOK_INDEX.csv results/
